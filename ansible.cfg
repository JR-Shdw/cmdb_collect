[defaults]
roles_path = roles
vault_password_file = ../.vault_pass

[ssh_connection]
# -F/dev/null : ignore ~/.ssh/config (id_ed25519 offerte avant cmdb_scan_ed25519)
# IdentitiesOnly=yes : seule la clé -i est offerte (pas l'agent SSH)
ssh_args = -C -F/dev/null -o IdentitiesOnly=yes -o StrictHostKeyChecking=accept-new
