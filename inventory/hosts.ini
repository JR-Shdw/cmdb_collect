# Inventory example — adapt to your infrastructure.
# Hostnames follow the Constellation theme (star names).
# Uncomment and set ansible_host to your own addresses.
#
# CMDB API reachable at http://10.0.1.1:8000 in this example.

[bare_metal]
# vega       ansible_host=198.51.100.1    # monitoring, CMDB server
# altair     ansible_host=198.51.100.2    # CI/CD, comms
# deneb      ansible_host=198.51.100.3    # services

[container_host]
# vega       ansible_host=198.51.100.1
# altair     ansible_host=198.51.100.2
# deneb      ansible_host=198.51.100.3
# mizar      ansible_host=198.51.100.5
# alcor      ansible_host=198.51.100.6

[vm]
# antares    ansible_host=198.51.100.9
# rigel      ansible_host=198.51.100.10
# sirius     ansible_host=198.51.100.4
# capella    ansible_host=198.51.100.11

[bastion]
# rigel      ansible_host=198.51.100.10
# sirius     ansible_host=198.51.100.4

[backup_server]
# capella    ansible_host=198.51.100.11
# mizar      ansible_host=198.51.100.5
# alcor      ansible_host=198.51.100.6

[workstation]
# procyon    ansible_host=10.0.0.13

[workstation:vars]
ansible_user=your_user
ansible_become_method=sudo

[all:vars]
ansible_user=root
ansible_ssh_private_key_file=~/.ssh/id_ed25519
cmdb_api_url=http://10.0.1.1:8000
